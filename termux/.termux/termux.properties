# PAVLE'S HYPER TERMUX CONFIG

# Extra keys - Hyper shortcuts u prvom redu!
extra-keys = [[ \
  {key: F1, popup: {macro: "SHIFT TAB", display: "⇤"}}, \
  {key: F2, popup: {macro: "px", display: "🖥️"}}, \
  {key: F3, popup: {macro: "i", display: "📊"}}, \
  {key: F4, popup: {macro: "sync", display: "🔄"}}, \
  {key: F5, popup: {macro: "elite", display: "⚡"}} \
], [ \
  'ESC', 'TAB', 'CTRL', 'ALT', '/', '-', 'HOME', 'UP', 'END', 'PGUP' \
], [ \
  '~', '|', 'LEFT', 'DOWN', 'RIGHT', 'PGDN' \
]]

# Swipe down gesture → elite shortcuts help
shortcut.open-menu = elite

# Bell character behavior
bell-character=vibrate

# Back button behavior  
back-key=escape

# Extra dark theme
use-black-ui=true
